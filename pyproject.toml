[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pycitizen"
version = "0.1.0"
description = "Async Python SDK for Citizen's public incident API"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "pycitizen contributors" }]
requires-python = ">=3.11"
keywords = ["citizen", "incidents", "crime", "safety", "api", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.9",
]

[project.urls]
Repository = "https://github.com/pycitizen/pycitizen"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "build>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pycitizen"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
